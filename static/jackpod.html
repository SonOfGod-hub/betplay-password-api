<script>
  /**
   * Función para iniciar la animación de carrusel para dispositivos móviles y tablets.
   *
   * @requires HTML: El elemento con el `id="priceTrack"` debe existir en el DOM.
   * @requires HTML: Las cards deben tener la `class="price__card"`
   * @requires CSS: El contenedor con la `class="price"` debe tener `overflow: hidden`
   * @requires CSS: El contenedor con la `class="price__track"` debe tener `transition: transform 0.5s ease-in-out`
   * @returns {void}: Esta función no retorna ningun valor.
   * */
  document.addEventListener("DOMContentLoaded", () => {
    // Estado original del DOM
    const track = document.getElementById('priceTrack');

    const TOTAL_CARDS = 3;
    const CAROUSEL_INTERVAL_MS = 3000;
    const TRANSITION = "transform 0.5s ease-in-out";

    let currentIndex = 0;
    let carouselInterval = null;
    let isDragging = false;
    let startX = 0;
    let startTranslateX = 0;

    // Determinar el tamaño de las cards para alinearlas hacia la izquierda.
    function getSlideDistance() {
      return track.querySelector(".price__card").offsetWidth + 12;
    }

    // Posición actual del slider en el eje x
    function getCurrentTranslateX() {
      const matrix = new DOMMatrixReadOnly(window.getComputedStyle(track).transform);
      return matrix.m41;
    }

    // Crear la animación
    function setTransform(x, transition = "none") {
      track.style.transition = transition;
      track.style.transform = `translateX(${x}px)`;
    }

    // Ajustar la propiedad translateX para el scroll "infinito"
    function wrapTranslateX(x) {
      const totalWidth = TOTAL_CARDS * getSlideDistance();

      if (x < -totalWidth) return x + totalWidth;
      if (x > 0) return x - totalWidth;

      return x;
    }

    // Alinear el slider a la card más cercana
    function snapToIndex(index) {
      currentIndex = ((index % TOTAL_CARDS) + TOTAL_CARDS) % TOTAL_CARDS;

      setTransform(-currentIndex * getSlideDistance(), "transform 0.3s ease-out");
    }

    // Iniciar el intervalo de la animación
    function startInterval() {
      if (!carouselInterval) {
        carouselInterval = setInterval(advanceCarousel, CAROUSEL_INTERVAL_MS)
      }
    }

    // Detener el intervalo de la animación
    function stopInterval() {
      clearInterval(carouselInterval);

      carouselInterval = null;
    }

    // Avanzar a la siguiente card, se reinicia el ciclo al llegar al final
    function advanceCarousel() {
      currentIndex++;

      setTransform(-currentIndex * getSlideDistance(), TRANSITION);

      if (currentIndex === TOTAL_CARDS) {
        setTimeout(() => {
          currentIndex = 0;
          setTransform(0);

          setTimeout(() => (track.style.transition = TRANSITION), 50)
        }, 500)
      }
    }

    // Obtener el punto de inicio al arrastrar el elemento
    function handleDragStart(clientX) {
      if (window.innerWidth >= 800) return;

      isDragging = true;
      startX = clientX;
      startTranslateX = getCurrentTranslateX()
      stopInterval()

      track.style.transition = 'none'
    }

    // Desplazar el slider hacia el punto de arrastre
    function handleDragMove(clientX) {
      if (!isDragging || window.innerWidth >= 800) return;
      const raw = startTranslateX + (clientX - startX)

      const wrapped = wrapTranslateX(raw)

      if (wrapped !== raw) startTranslateX += wrapped - raw

      setTransform(startTranslateX + (clientX - startX))
    }

    // Soltar el arrastre y alinear el slider a la card más cercana
    function handleDragEnd() {
      if (!isDragging || window.innerWidth >= 800) return;

      isDragging = false;

      const slideDistance = getSlideDistance()
      const currentTranslate = wrapTranslateX(getCurrentTranslateX())

      if (currentTranslate !== getCurrentTranslateX()) setTransform(currentTranslate)

      snapToIndex(Math.round(Math.abs(currentTranslate) / slideDistance))

      setTimeout(startInterval, 300)
    }

    // Inicializar el carrusel
    function initCarousel() {
      const cards = track.querySelectorAll('.price__card');

      // Duplicar las cards
      if (cards.length === TOTAL_CARDS) {
        cards.forEach((card) => track.appendChild(card.cloneNode(true)));
      }

      // Iniciar la animación cada 3segundos
      startInterval();

      // Touch events
      track.addEventListener('touchstart', (e) => handleDragStart(e.touches[0].clientX), {passive: true});
      track.addEventListener('touchmove', (e) => handleDragMove(e.touches[0].clientX), {passive: true});
      track.addEventListener('touchend', handleDragEnd);

      // Mouse events
      track.addEventListener('mousedown', (e) => {
        e.preventDefault();
        handleDragStart(e.clientX);
      });
      document.addEventListener('mousemove', (e) => {
        if (isDragging) {
          e.preventDefault();
          handleDragMove(e.clientX);
        }
      });
      document.addEventListener('mouseup', handleDragEnd);
    }

    // Destruir el carrusel
    function destroyCarousel() {
      // Detener el intervalo
      stopInterval();

      track.style.opacity = '0'

      setTimeout(() => {
        // Eliminar las cards duplicadas
        track.querySelectorAll('.price__card').forEach((card, index) => {
          if (index >= TOTAL_CARDS) card.remove();
        })

        // Eliminar los estilos
        setTransform(0)

        currentIndex = 0;

        track.style.opacity = '1'
      }, 50)
    }

    // Iniciar la animación
    if (window.innerWidth < 800) initCarousel();

    // Iniciar/detener la animación según el tamaño del dispositivo
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);

      resizeTimeout = setTimeout(() => {
        if (window.innerWidth >= 800) destroyCarousel();
        else if (!carouselInterval) initCarousel();
      }, 250);
    });

    getFileInfo();
    setInterval(() => getFileInfo(), 30000);
  });

  const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]');
  const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl));

  let duration = 60000;
  let percentage = 0.999;

  function getFileInfo() {
    $.ajax({
      url: '/jackpod.json',
      method: 'GET',
      success: function (_data) {
        const data = JSON.parse(JSON.stringify(_data));

        const objExtra = document.querySelectorAll(".price__amount--first label");
        const objSuper = document.querySelectorAll(".price__amount--second label");
        const objMega = document.querySelectorAll(".price__amount--third label");

        objExtra.forEach((obj) => {
          const current = parseValue(obj)
          const currentAmount = data[0].MONTO_ACTUAL
          const minAmount = data[0].VALOR_MINIMO

          addAnimation(current, currentAmount, minAmount, obj);
        })

        objSuper.forEach((obj) => {
          const current = parseValue(obj)
          const currentAmount = data[1].MONTO_ACTUAL
          const minAmount = data[1].VALOR_MINIMO

          addAnimation(current, currentAmount, minAmount, obj);
        })

        objMega.forEach((obj) => {
          const current = parseValue(obj)
          const currentAmount = data[2].MONTO_ACTUAL
          const minAmount = data[2].VALOR_MINIMO

          addAnimation(current, currentAmount, minAmount, obj);
        })
      },
      error: function (xhr, status, error) {
        console.log("Error al obtener información del archivo JSON:", error);
      }
    });
  }

  /**
   * Convierte el valor actual en un dato numérico.
   *
   * @param {HTMLElement} htmlElement -> HTML sobre el cual se va a reemplazar el valor.
   * @returns {number} -> Retorna el valor actual como un número.
   * */
  function parseValue(htmlElement) {
    return Number.parseInt(htmlElement.innerHTML.replace("$", "").replaceAll('.', ""))
  }

  /**
   * Función para aplicar la animación en los valores del Jackpot para cada categoría: Extra, Super y Mega
   *
   * @param {number} current -> Valor actual del elemento HTML
   * @param {number} currentAmount -> Monto actual del Jackpot
   * @param {number} minAmount -> Valor mínimo del Jackpot
   * @param {HTMLElement} obj -> Elemento HTML al cual se le aplica la animación
   * @returns {void} -> Esta función no retorna ningun valor.
   * */
  function addAnimation(current, currentAmount, minAmount, obj) {
    if (current !== currentAmount) {
      if (current < currentAmount && current !== 0) {
        animateValue(obj, current, currentAmount, duration);
      } else if (minAmount < currentAmount) {
        animateValue(obj, currentAmount * percentage, currentAmount, duration);
      } else {
        animateValue(obj, 0, currentAmount, duration);
      }
    }
  }

  function animateValue(obj, start, end, duration) {
    let startTimestamp = null;
    const step = (timestamp) => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      obj.innerHTML = "$" + new Intl.NumberFormat("de-DE").format(Math.floor(progress * (end - start) + start));
      if (progress < 1) {
        window.requestAnimationFrame(step);
      }
    };
    window.requestAnimationFrame(step);
  }
</script>
